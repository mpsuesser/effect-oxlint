name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.0'

            - run: bun install --frozen-lockfile

            - name: Lint & format
              run: bunx vp check

            - name: Test
              run: bun run test

            - name: Typecheck
              run: bun run typecheck
