name: Publish

on:
    workflow_dispatch:
        inputs:
            runner:
                description: Runner label for manual publish dispatch
                required: false
                default: ubuntu-latest
    release:
        types: [published]

jobs:
    publish-npm:
        name: Publish to npm
        runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.0'

            - run: bun install --frozen-lockfile

            - name: Test
              run: bun run test

            - name: Typecheck
              run: bun run typecheck

            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'

            # npm OIDC trusted publishing requires npm >= 11.5.1
            - name: Upgrade npm
              run: npm install -g npm@latest

            - name: Publish
              run: npm publish --provenance --access public

    publish-jsr:
        name: Publish to JSR
        runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.0'

            - run: bun install --frozen-lockfile

            - run: npx jsr publish
